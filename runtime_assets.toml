schema_version = 1

[release]
ignored_untracked_prefixes = [
  "build/",
  "dist/",
  "runtime/content-templates/",
]

[profiles.core]
groups = ["microview"]
required_python_modules = []
required_files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
features = ["measurement", "capture", "digital-slide"]

[profiles.full]
extends = "core"
groups = ["area-infer", "area-models", "segment-anything"]
required_python_modules = ["PIL", "torch", "torchvision"]
features = ["area-inference", "magic-segmentation"]

[groups.microview]
root = "runtime/camera/microview"
filter = "all"
required_files = [
  "runtime/camera/microview/driver/MVBT.inf",
  "runtime/camera/microview/driver/MVBT.sys",
  "runtime/camera/microview/driver/saa7130.sys",
  "runtime/camera/microview/x64/Function.dll",
  "runtime/camera/microview/x64/MVAPI.dll",
  "runtime/camera/microview/x64/MVBT.dll",
  "runtime/camera/microview/x64/MVDEVICE.ocx",
  "runtime/camera/microview/x64/MV_Twain.ds",
  "runtime/camera/microview/x64/mvavi.dll",
  "runtime/camera/microview/x64/saa7130.dll",
  "runtime/camera/microview/x86/Function.dll",
  "runtime/camera/microview/x86/MVAPI.dll",
  "runtime/camera/microview/x86/MVBT.dll",
  "runtime/camera/microview/x86/MVDEVICE.ocx",
  "runtime/camera/microview/x86/MV_Twain.ds",
  "runtime/camera/microview/x86/mvavi.dll",
  "runtime/camera/microview/x86/saa7130.dll",
]

[groups.area-infer]
root = "runtime/area-infer"
filter = "area-infer"
required_files = [
  "runtime/area-infer/app/__init__.py",
  "runtime/area-infer/app/engine.py",
  "runtime/area-infer/app/main.py",
  "runtime/area-infer/app/model_metadata.py",
  "runtime/area-infer/app/request_limits.py",
  "runtime/area-infer/app/security.py",
  "runtime/area-infer/vendor/yolact/LICENSE",
  "runtime/area-infer/vendor/yolact/backbone.py",
  "runtime/area-infer/vendor/yolact/yolact.py",
  "runtime/area-infer/vendor/yolact/data/__init__.py",
  "runtime/area-infer/vendor/yolact/data/coco.py",
  "runtime/area-infer/vendor/yolact/data/config.py",
  "runtime/area-infer/vendor/yolact/data/grid.npy",
  "runtime/area-infer/vendor/yolact/layers/__init__.py",
  "runtime/area-infer/vendor/yolact/layers/box_utils.py",
  "runtime/area-infer/vendor/yolact/layers/interpolate.py",
  "runtime/area-infer/vendor/yolact/layers/output_utils.py",
  "runtime/area-infer/vendor/yolact/layers/functions/__init__.py",
  "runtime/area-infer/vendor/yolact/layers/functions/detection.py",
  "runtime/area-infer/vendor/yolact/layers/modules/__init__.py",
  "runtime/area-infer/vendor/yolact/layers/modules/multibox_loss.py",
  "runtime/area-infer/vendor/yolact/utils/__init__.py",
  "runtime/area-infer/vendor/yolact/utils/augmentations.py",
  "runtime/area-infer/vendor/yolact/utils/cython_nms.pyx",
  "runtime/area-infer/vendor/yolact/utils/functions.py",
  "runtime/area-infer/vendor/yolact/utils/logger.py",
  "runtime/area-infer/vendor/yolact/utils/nvinfo.py",
  "runtime/area-infer/vendor/yolact/utils/timer.py",
]

[groups.area-models]
root = "runtime/area-models"
filter = "area-models"
required_files = [
  "runtime/area-models/b_v1_1.3.pth",
  "runtime/area-models/b_cv_1.3.pth",
  "runtime/area-models/b_c1_1.3.pth",
  "runtime/area-models/b_cm_1.3.pth",
  "runtime/area-models/b_cc_1.3.pth",
  "runtime/area-models/b_cvlm_1.3.pth",
]

[groups.segment-anything]
root = "runtime/segment-anything"
filter = "segment-anything"
required_files = [
  "runtime/segment-anything/edge_sam/edge_sam_encoder.onnx",
  "runtime/segment-anything/edge_sam/edge_sam_decoder.onnx",
  "runtime/segment-anything/edge_sam_3x/edge_sam_3x_encoder.onnx",
    "runtime/segment-anything/edge_sam_3x/edge_sam_3x_decoder.onnx",
]

