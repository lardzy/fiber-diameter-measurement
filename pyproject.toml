[build-system]
requires = ["setuptools>=68", "wheel", "pybind11==3.0.4"]
build-backend = "setuptools.build_meta"

[project]
name = "fiber-diameter-measurement"
dynamic = ["version"]
description = "Offline desktop software for fiber diameter measurement."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "qtawesome>=1.4",
  "opencv-python==4.13.0.92",
  "scikit-image>=0.26,<0.27",
  "numpy>=1.26",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "onnxruntime>=1.18",
  "Pillow>=10.4",
  "zlib-ng==1.0.0",
  "tifffile>=2025.5.10",
  "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
]
benchmark = [
  "psutil>=6.1",
]
area-infer = [
  "torch>=2.4",
  "torchvision>=0.19",
]
interactive-seg = [
  "torch>=2.4",
  "torchvision>=0.19",
  "timm>=1.0",
  "segment-anything-hq",
]
packaging = [
  "pyinstaller>=6.0",
]

[project.scripts]
fdm = "fdm.app:main"
fdm-screenshot-tool = "fdm.screenshot_agent:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "fdm.version.__version__"}

[tool.setuptools.package-data]
"fdm.ui" = ["assets/fluent/*.svg", "assets/fluent/LICENSE", "assets/fluent/NOTICE", "assets/fluent/manifest.json"]
"fdm._native" = ["licenses/*.txt"]
"fdm.live_experiment" = ["excel_template.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
